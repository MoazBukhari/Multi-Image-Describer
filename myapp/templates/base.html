<!-- myapp/templates/base.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    {% load static %}
    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Multi Image Describer{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-secondary">
    <nav class="navbar navbar-expand-lg bg-warning" data-bs-theme="light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="{% static 'img/logo.png' %}" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
            Multi Image Describer
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
            <div class="navbar-nav flex-grow-1">
                <a class="nav-link btn btn-outline-light me-2 {% block nav_active_home %}{% endblock %}" href="#">Home</a>
                <a class="nav-link btn btn-outline-light me-2 {% block nav_active_features %}{% endblock %}" href="#features">Features</a>
                <a class="nav-link btn btn-outline-light me-2 {% block nav_active_pricing %}{% endblock %}" href="#pricing">Pricing</a>
                {% comment %} <a class="nav-link btn btn-outline-light me-2 ms-lg-auto" href="#" id="signin-btn">Sign In</a>
                <a id="user-button"></a> {% endcomment %}
                <div class="d-flex align-items-center sm-auto ms-lg-auto">
                    <!-- Sign In Button (visible by default) -->
                    <a class="nav-link btn btn-outline-light me-2" href="#" id="signin-btn" style="display: none;">Sign In</a>
                    
                    <!-- User Button (hidden until Clerk loads and user is logged in) -->
                    <div id="user-button" style="display: none;"></div>
                    <div class="ms-2 me-3 text-dark" id="userCreditDisplay" style="display: none;">
                        Credits: <span id="userCreditCount">0</span>
                    </div>
                    <div class="d-flex align-items-center ms-auto">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" id="darkModeToggle">
                            <img src="{% static 'img/dark-mode.png' %}" alt="Dark Mode Icon" width="20" height="20" class="d-inline-block align-text-top me-1">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </nav>

    <main>
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock %}
    </main>

    </div>

    <footer class="bg-secondary text-center text-light text-bold p-3">
        <!-- Copyright -->
            © 2026 Copyright:
            <a class="text-light me-2" href="#">Multi Image Describer</a>
            Build by Moaz Bukhari
            
            <a href="https://linkedin.com/in/moaz-bukhari" target="_blank">
                <img src="{% static 'img/linkedin-icon.png' %}" alt="LinkedIn Icon" width="40" height="40" class="d-inline-block me-1"></a>
            <a href="https://github.com/moazbukhari" target="_blank">
                <img src="{% static 'img/github-icon.png' %}" alt="GitHub Icon" width="43" height="43" class="d-inline-block me-1"></a>
        <!-- Copyright -->
    </footer>



    
    <script 
    async
        crossorigin="anonymous" 
        data-clerk-publishable-key="pk_test_ZGVlcC1zdGFnLTkuY2xlcmsuYWNjb3VudHMuZGV2JA"
        src="https://deep-stag-9.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript">
    </script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
